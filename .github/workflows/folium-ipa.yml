name: Folium diagnostic IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folium-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      FOLIUM_TEST_DEVICE: iPhone
      FOLIUM_TEST_IOS: '27.2'
    steps:
      - name: Check out pinned source and cores
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Build and package arm64 iPhone app
        run: bash ci/build-folium-ipa.sh

      - name: Upload IPA and provenance
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: Folium-iPhone-iOS-27.2-${{ github.sha }}
          path: build/diagnostic.*/artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node.js 24)
        with:
          name: Folium-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/diagnostic.*/logs/
            build/diagnostic.*/Folium-build.xcresult/
          if-no-files-found: warn
          retention-days: 14
